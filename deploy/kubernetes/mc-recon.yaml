# Portable Kubernetes deployment: EKS, AKS, GKE, OpenShift, k3s, on-prem.
#   kubectl apply -f deploy/kubernetes/mc-recon.yaml
# Replace the image reference. The default StorageClass provides the volume on every cloud.
#
# replicas: 1 + Recreate is deliberate. State is SQLite on a ReadWriteOnce volume, and run locks
# live in process memory. Scale out only after moving to the Postgres backends
# (docs/DEPLOYMENT.md, "Scaling and state").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mc-recon-data
  labels: {app.kubernetes.io/name: mc-recon}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-recon
  labels: {app.kubernetes.io/name: mc-recon}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: mc-recon}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mc-recon}
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mc-recon
          image: REGISTRY/mc-recon:TAG   # e.g. <acct>.dkr.ecr.<region>.amazonaws.com/mc-recon:abc123
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: PORT, value: "8000"}
            - {name: MC_DB_PATH, value: /app/var/mc_recon.sqlite}
            - {name: MC_LOG_LEVEL, value: info}
            # Future secrets (LLM / Disseqt keys) come from a Secret synced from the cloud
            # secret manager (External Secrets / CSI driver), never from the image:
            # - name: ANTHROPIC_API_KEY
            #   valueFrom: {secretKeyRef: {name: mc-recon-secrets, key: anthropic-api-key}}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /app/var}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mc-recon-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mc-recon
  labels: {app.kubernetes.io/name: mc-recon}
spec:
  selector: {app.kubernetes.io/name: mc-recon}
  ports:
    - {name: http, port: 80, targetPort: http}
