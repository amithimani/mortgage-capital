[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mc-recon"
version = "0.1.0"
description = "Mortgage Capital PoC: data reconciliation & anomaly detection agent with EU AI Act governance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Agent runtime: graph, checkpointer, HTTP service.
agent = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "fastapi>=0.115",
    "uvicorn>=0.29",
]
# Week 3: real policy gate + tracing. Pinned: the plan depends on 0.11.2 signatures.
disseqt = [
    "disseqt-ai-sdk==0.11.2",
]
dev = [
    "mc-recon[agent]",
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
mc-recon = "mc_recon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
